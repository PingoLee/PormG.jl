          # The binary connects the same way: TCP to 127.0.0.1, as f1, with a password.
          psql -h 127.0.0.1 -U f1 -d pormg_trim -XAt -c 'SELECT system_user' | tee /dev/stderr |
            grep -qxF 'scram-sha-256:f1'
          psql -h 127.0.0.1 -U f1 -d pormg_trim -XAt \
            -c "SELECT left(rolpassword, 14) FROM pg_authid WHERE rolname = 'f1'" | grep -qxF 'SCRAM-SHA-256$'
      - uses: julia-actions/setup-julia@v2
        with:
