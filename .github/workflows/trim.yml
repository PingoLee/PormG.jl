# Builds the read-only entry of the `juliac --trim` fixture app (test/trim/read.jl, #1599) as a trimmed
# binary, runs it, and fails unless it exits 0 and prints the fixture's row. The verifier's rows are
# reported (job summary and artifact), never a failure condition: the track lowers them one layer at a
# time, and a total rises whenever a wall opens. See test/trim/README.md.
#
# Not on every PR: a trimmed build takes several minutes. It runs nightly, by hand, and on a PR that
# touches the fixture or this file.
name: Trim (juliac)

on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'
  pull_request:
    paths:
      - 'test/trim/**'
      - '.github/workflows/trim.yml'

permissions:
  contents: read
  actions: write   # julia-actions/cache deletes the caches it replaces

defaults:
  run:
    shell: bash    # -eo pipefail: a failed juliac fails its step, not the `tee` after it

concurrency:
  group: trim-${{ github.ref }}
  cancel-in-progress: true

env:
  # The versions test/trim/README.md pins. Change them together.
  TRIM_JULIA: '1.13.3'
  TRIM_JULIAC: '0.3.12'
  # The row the read-only entry prints, as its JIT control does (test/trim/prep.jl seeds it).
  TRIM_EXPECTED_ROW: "step\trow\t1 2008 Monaco Grand Prix 2008-05-25"

jobs:
  read-only:
    name: Trimmed read (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.TRIM_JULIA }}
      - uses: julia-actions/cache@v2
      - name: Install JuliaC
        run: |
          julia -e 'using Pkg; Pkg.Apps.add(name = "JuliaC", version = ENV["TRIM_JULIAC"])'
          echo "$(julia -e 'print(first(DEPOT_PATH))')/bin" >> "$GITHUB_PATH"
      - name: Instantiate the fixture
        run: |
          julia --project=test/trim -e 'using Pkg; Pkg.instantiate(); Pkg.status()'
      - name: JIT control
        run: |
          julia --project=test/trim test/trim/prep.jl run-jit
          julia --project=test/trim test/trim/read.jl run-jit
          julia --project=test/trim test/trim/prep.jl run-jit-tasks
          julia --project=test/trim test/trim/read.jl run-jit-tasks tasks
      - name: Build the trimmed binary
        id: build
        run: |
          mkdir -p build && cd build
          JULIA_CPU_TARGET=native juliac --project ../test/trim --output-exe read \
            --trim=unsafe-warn --experimental ../test/trim/read.jl 2>&1 | tee build.log
      - name: Run the trimmed binary
        run: |
          julia --project=test/trim test/trim/prep.jl run
          # A task body the image never compiled dies silently, so a broken binary hangs rather
          # than crashes: the timeout turns the hang into a failure.
          set +e
          timeout -k 10 300 build/read run 2>&1 | tee build/run.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "exit status: $status"
          if [ "$status" -ne 0 ]; then
            echo "::error::the trimmed read-only binary exited with status $status (124 = timed out)"
            exit 1
          fi
          if ! grep -qxF "$(printf '%b' "$TRIM_EXPECTED_ROW")" build/run.txt; then
            echo "::error::the trimmed read-only binary exited 0 without printing the expected row"
            exit 1
          fi
      - name: Run the pool's long-lived tasks in the trimmed binary
        # The reaper and the deferred close (#1599 layer 2): the `tasks` run adds two steps, about 20 s,
        # that fail with exit 4 or 5 when the task never ran. Runs even when the read above failed.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          julia --project=test/trim test/trim/prep.jl run-tasks
          set +e
          timeout -k 10 300 build/read run-tasks tasks 2>&1 | tee build/tasks.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "exit status: $status"
          if [ "$status" -ne 0 ]; then
            echo "::error::the trimmed binary's tasks run exited with status $status (4 = reaper, 5 = deferred close, 124 = timed out)"
            exit 1
          fi
          grep -q "$(printf 'step\treap\tclosed ')" build/tasks.txt &&
            grep -q "$(printf 'step\tclose\tdeferred')" build/tasks.txt || {
            echo "::error::the trimmed binary's tasks run exited 0 without the reap and close lines"
            exit 1
          }
      - name: Count the verifier's rows
        if: always()
        run: |
          [ -f build/build.log ] || exit 0
          python3 -I test/trim/tools/rows.py build/build.log > build/rows.txt 2>&1 || true
          python3 -I test/trim/tools/classify.py build/build.log --layers > build/layers.txt 2>&1 || true
          {
            echo "## Trimmed read-only entry (Julia $TRIM_JULIA, JuliaC $TRIM_JULIAC)"
            echo
            echo "The row count is reported, not checked. The pass condition is the run below."
            echo
            echo "### The binary's step lines"
            echo '```'
            cat build/run.txt 2>/dev/null || echo "(the binary did not run)"
            echo '```'
            echo "### The tasks run's step lines"
            echo '```'
            cat build/tasks.txt 2>/dev/null || echo "(the tasks run did not run)"
            echo '```'
            echo "### Verifier rows (rows.py)"
            echo '```'
            cat build/rows.txt
            echo '```'
            echo "### Rows by layer (classify.py --layers)"
            echo '```'
            cat build/layers.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the build log and the row tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trim-read-only
          path: |
            build/build.log
            build/rows.txt
            build/layers.txt
            build/run.txt
            build/tasks.txt
          if-no-files-found: warn
