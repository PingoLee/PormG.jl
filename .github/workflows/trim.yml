      TRIM_VARIANT: postgres
      # The server's own error for the `fail` step's missing table (undefined_table).
      TRIM_FAIL_SQLSTATE: 42P01
      PORMG_TRIM_HOST: 127.0.0.1
      PORMG_TRIM_PORT: '5432'
      PORMG_TRIM_USER: f1
      PORMG_TRIM_PASSWORD: trim-ci-throwaway
      PORMG_TRIM_DATABASE: pormg_trim
      # The role the two connection shapes without a password log in as (#1599 layer 2): trusted on this throwaway
      # container's fixture database only, by the step below; every other role still authenticates with SCRAM.
      PORMG_TRIM_TRUST_USER: trim_trust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust one role for the connection shapes without a password
        env:
          PGPASSWORD: ${{ env.PORMG_TRIM_PASSWORD }}
        run: |
          # A `trust` line for `trim_trust` on `pormg_trim`, first in the container's pg_hba.conf, then a reload. The
          # runner reaches the container through Docker's port mapping, so the source address is the bridge's, not
          # 127.0.0.1: the line names the role and the database, not an address.
          psql -h 127.0.0.1 -U f1 -d pormg_trim -XAt -c 'CREATE ROLE trim_trust LOGIN'
          docker exec ${{ job.services.postgres.id }} sh -c \
            'sed -i "1i host pormg_trim trim_trust all trust" "$PGDATA/pg_hba.conf"'
          psql -h 127.0.0.1 -U f1 -d pormg_trim -XAt -c 'SELECT pg_reload_conf()'
          psql -h 127.0.0.1 -U trim_trust -d pormg_trim -w -XAt -c 'SELECT current_user' | grep -qxF trim_trust
