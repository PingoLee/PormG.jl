# Builds the read-only entry of the `juliac --trim` fixture app (test/trim/read.jl, #1599) as a trimmed
# binary, runs it, and fails unless it exits 0 and prints the fixture's row. The verifier's rows are
# reported (job summary and artifact), never a failure condition: the track lowers them one layer at a
# time, and a total rises whenever a wall opens. See test/trim/README.md.
#
# A second SQLite job builds the full entry (test/trim/main.jl, #1694): the single-row write and a
# bulk_insert. It fails unless that binary exits 0 and prints its write, read, update, delete and bulk
# lines and both refusals.
#
# Two more jobs build the fixture's server variants (test/trim/mysql, test/trim/postgres, #1614) and run
# them against a service container: MySQL 8.4, and PostgreSQL 19 through Postgres.jl with SCRAM-SHA-256.
# Each fails unless its binary exits 0, prints the row, runs the single-row write (create, read back, update,
# delete), and its `fail` step prints the server's own error.
#
# Not on every PR: a trimmed build takes several minutes. It runs nightly, by hand, and on a PR that
# touches the fixture, this file or one of the three driver extensions the jobs build.
name: Trim (juliac)

on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'
  pull_request:
    paths:
      - 'test/trim/**'
      - '.github/workflows/trim.yml'
      - 'ext/PormGMySQLExt.jl'
      - 'ext/PormGPostgresExt.jl'
      - 'ext/PormGSQLiteExt.jl'

permissions:
  contents: read
  actions: write   # julia-actions/cache deletes the caches it replaces

defaults:
  run:
    shell: bash    # -eo pipefail: a failed juliac fails its step, not the `tee` after it

concurrency:
  group: trim-${{ github.ref }}
  cancel-in-progress: true

env:
  # The versions test/trim/README.md pins. Change them together.
  TRIM_JULIA: '1.13.4'
  TRIM_JULIAC: '0.3.12'
  # The row the read-only entry prints, as its JIT control does (test/trim/prep.jl seeds it).
  TRIM_EXPECTED_ROW: "step\trow\t1 2008 Monaco Grand Prix 2008-05-25"
  # The read steps every entry runs after its first read (test/trim/tools/reads.jl, #1599 layer 5): a comparison
  # filter on a date and on an integer, an order_by each way, and the other common lookups (`__@gt`, `__@lte`,
  # `__@range`, `__@in` over integers and over text, `__@isnull` each way, `__@icontains`, `__@contains`), and the
  # comparisons against an expression (an `F` with arithmetic on each side, `Extract`, the `@year` transform, a
  # `Case`/`When` on each side), the untyped read (#1599 layer 6), and the function shapes (a number function in a
  # projection and in a filter, `Count`/`Sum` grouped, `Upper(Lower(...))`, a `Case` whose `then` is an `F`), and the
  # subqueries (`__@in` a queryset, an `Exists` and a `Subquery` correlated with `OuterRef`, a `Subquery` on the right
  # of a filter), and the joins (`values`/`order_by` across a join, a `.with(...)` column in a projection and in a filter,
  # `RowNumber` over a partition and `Rank` over an order), and the shapes applications use most (two and three hops
  # forward and one reverse, `__@yyyy_mm`/`__@ne`/`__@nin`, `Qor` over a `Q`, `page`/`limit`/`offset`,
  # `Count(distinct)`/`Max`/`Avg`/`Min`, `Sum(Case(...))`, `distinct()`, `ToChar` ordered by its alias, an INNER CTE join),
  # a `.copy()` changed and read beside its original (#1684),
  # a many-to-many hop forward and backward through `Result` (#1689),
  # a filter on an aggregate alias (`HAVING`: a `Count` and a `Sum`, and a value refused) (#1846),
  # over the rows every prep.jl seeds. One line per lookup, order or expression; each job checks that its binary prints
  # every one.
  TRIM_READ_LINES: |-
    step\tcompare\tdate__@gte 1 rows: Brazilian Grand Prix
    step\tcompare\tround__@lt 1 rows: Monaco Grand Prix
    step\torder\tdate: Monaco Grand Prix, Brazilian Grand Prix
    step\torder\t-date: Brazilian Grand Prix, Monaco Grand Prix
    step\tlookup\tround__@gt 1 rows: Brazilian Grand Prix
    step\tlookup\tround__@lte 1 rows: Monaco Grand Prix
    step\tlookup\tdate__@range 1 rows: Monaco Grand Prix
    step\tlookup\tround__@in 1 rows: Monaco Grand Prix
    step\tlookup\tname__@in 1 rows: Brazilian Grand Prix
    step\tlookup\tdate__@isnull false 2 rows: Monaco Grand Prix, Brazilian Grand Prix
    step\tlookup\tdate__@isnull true 0 rows: none
    step\tlookup\tname__@icontains 1 rows: Brazilian Grand Prix
    step\tlookup\tname__@contains 1 rows: Monaco Grand Prix
    step\texpr\tyear__@gt F(round) + 2000 1 rows: Monaco Grand Prix
    step\texpr\tF(round) + 1 == 19 1 rows: Brazilian Grand Prix
    step\texpr\tExtract(date, month) == 11 1 rows: Brazilian Grand Prix
    step\texpr\tdate__@year 2 rows: Monaco Grand Prix, Brazilian Grand Prix
    step\texpr\tround__@gte Case 1 rows: Monaco Grand Prix
    step\texpr\tCase == 1 1 rows: Monaco Grand Prix
    step\tuntyped\tfirst Monaco Grand Prix round 6 date 2008-05-25
    step\tuntyped\tlist 2 rows: Monaco Grand Prix, Brazilian Grand Prix
    step\tfunc\tAbs/Round 2 rows: Monaco Grand Prix 4 6, Brazilian Grand Prix 8 18
    step\tfunc\tAbs == 4 1 rows: Monaco Grand Prix
    step\tfunc\tCount/Sum 1 rows: 2008 2 24
    step\tfunc\tUpper(Lower) 2 rows: MONACO GRAND PRIX, BRAZILIAN GRAND PRIX
    step\tfunc\tCase then F 2 rows: Monaco Grand Prix 6, Brazilian Grand Prix 0
    step\tsubquery\tcircuitid__@in query 1 rows: Monaco Grand Prix
    step\tsubquery\tExists OuterRef 1 rows: Brazilian Grand Prix
    step\tsubquery\tSubquery OuterRef column 2 rows: Monaco Grand Prix at Circuit de Monaco, Brazilian Grand Prix at Autódromo José Carlos Pace
    step\tsubquery\tcircuitid == Subquery 1 rows: Brazilian Grand Prix
    step\tsubquery\tround == Subquery OuterRef 2 rows: Monaco Grand Prix, Brazilian Grand Prix
    step\tjoin\torder_by path 2 rows: Brazilian Grand Prix at Autódromo José Carlos Pace, Monaco Grand Prix at Circuit de Monaco
    step\tjoin\torder_by -alias 2 rows: Monaco Grand Prix at Circuit de Monaco, Brazilian Grand Prix at Autódromo José Carlos Pace
    step\tjoin\tCTE column 2 rows: Monaco Grand Prix 1, Brazilian Grand Prix 1
    step\tjoin\tCTE filter 1 rows: Brazilian Grand Prix 1
    step\tjoin\tRowNumber partition 2 rows: Monaco Grand Prix 1, Brazilian Grand Prix 2
    step\tjoin\tRank order 2 rows: Brazilian Grand Prix 1, Monaco Grand Prix 2
    step\tcte\tSubquery 2 rows: Monaco Grand Prix 2008, Brazilian Grand Prix 2008
    step\tcte\tExists 2 rows: Monaco Grand Prix false, Brazilian Grand Prix true
    step\tcte\tRowNumber 2 rows: Monaco Grand Prix 1, Brazilian Grand Prix 2
    step\tcte\tCase 2 rows: Monaco Grand Prix 0, Brazilian Grand Prix 1
    step\tcte\tCast 2 rows: Monaco Grand Prix 6, Brazilian Grand Prix 18
    step\tcte\tF arithmetic 2 rows: Monaco Grand Prix 7, Brazilian Grand Prix 19
    step\tcte\tCase over a list 2 rows: Monaco Grand Prix 0, Brazilian Grand Prix 1
    step\thops\t2 hops 1 rows: stop 1 in Monaco
    step\thops\t3 hops 1 rows: Renault from None
    step\thops\treverse 2 rows: Autódromo José Carlos Pace 2008, Circuit de Monaco 2008
    step\tm2m\tdrivers__surname 1 rows: Monaco Grand Prix
    step\tm2m\traces__year 1 rows: Piquet
    step\tm2m\tvalues races__name 1 rows: Piquet in Monaco Grand Prix
    step\tlookup_more\tdate__@yyyy_mm 1 rows: Monaco Grand Prix
    step\tlookup_more\tround__@ne 1 rows: Brazilian Grand Prix
    step\tlookup_more\tround__@nin 1 rows: Brazilian Grand Prix
    step\tlookup_more\tQor(Q) 1 rows: Monaco Grand Prix
    step\tcopy\toriginal: Monaco Grand Prix, Brazilian Grand Prix
    step\tcopy\tcopy: Brazilian Grand Prix (18)
    step\tcopy\toriginal after its filter: Monaco Grand Prix; copy: Brazilian Grand Prix
    step\tcopy\tprojected original: Monaco Grand Prix, Brazilian Grand Prix; copy: Monaco Grand Prix
    step\tpage\tpage(1) 1 rows: Brazilian Grand Prix
    step\tpage\tpage(1, 1) 1 rows: Monaco Grand Prix
    step\tpage\tlimit offset 1 rows: Monaco Grand Prix
    step\taggregate\tCount distinct/Max/Avg/Min 1 rows: 2008 2 18 12.0 6
    step\taggregate\tSum(Case) 1 rows: 2008 1
    step\taggregate\tdistinct 1 rows: 2008
    step\taggregate\tToChar -alias 2 rows: Brazilian Grand Prix 2008-11, Monaco Grand Prix 2008-05
    step\taggregate\tCTE INNER 1 rows: Brazilian Grand Prix 1
    step\thaving\tCount n__@gt 1: 1 rows: 2008 2
    step\thaving\tCount n__@gt 2: 0 rows
    step\thaving\tSum s__@gte 24: 1 rows: 2008 24
    step\thaving\tn__@gt "abc": InvalidValueError: Error in filter on the `n` projection alias (number): The value is not a valid number
    step\tcount\tround__@gt 2; circuitid__country 1; year 1900 0
    step\texists\tyear 2008 true; year 1900 false
    step\ttables\tcolumntable of list(T) name, round: Monaco Grand Prix, Brazilian Grand Prix; rounds 6, 18

jobs:
  read-only:
    name: Trimmed read (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.TRIM_JULIA }}
      - uses: julia-actions/cache@v2
      - name: Install JuliaC
        run: |
          julia -e 'using Pkg; Pkg.Apps.add(name = "JuliaC", version = ENV["TRIM_JULIAC"])'
          echo "$(julia -e 'print(first(DEPOT_PATH))')/bin" >> "$GITHUB_PATH"
      - name: Instantiate the fixture
        run: |
          julia --project=test/trim -e 'using Pkg; Pkg.instantiate(); Pkg.status()'
      - name: JIT control
        run: |
          julia --project=test/trim test/trim/prep.jl run-jit
          mkdir -p build
          julia --project=test/trim test/trim/read.jl run-jit | tee build/jit.txt   # its untyped-read lines are the binary's reference
          julia --project=test/trim test/trim/prep.jl run-jit-tasks
          julia --project=test/trim test/trim/read.jl run-jit-tasks tasks
      - name: Build the trimmed binary
        id: build
        run: |
          mkdir -p build && cd build
          JULIA_CPU_TARGET=native juliac --project ../test/trim --output-exe read \
            --trim=unsafe-warn --experimental ../test/trim/read.jl 2>&1 | tee build.log
      - name: Run the trimmed binary
        run: |
          julia --project=test/trim test/trim/prep.jl run
          # A task body the image never compiled dies silently, so a broken binary hangs rather
          # than crashes: the timeout turns the hang into a failure.
          set +e
          timeout -k 10 300 build/read run 2>&1 | tee build/run.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "exit status: $status"
          if [ "$status" -ne 0 ]; then
            echo "::error::the trimmed read-only binary exited with status $status (3 read, 10 comparison filter, 11 order_by, 13 lookup, 14 expression comparison, 17 untyped read, 19 function read, 20 subquery read, 21 join read, 26 CTE read, 37 relation hops, 38 lookup or Q/Qor, 39 paging, 40 aggregate, 41 an engine's own read, 42 count, 43 exists, 46 typed rows into a table sink, 51 Q/Qor from 32 arguments, 54 a .copy() read, 56 a many-to-many hop, 57 a filter on an aggregate alias (HAVING), 52 a refused filter value not located as InvalidValueError, 124 = timed out)"
            exit 1
          fi
          if ! grep -qxF "$(printf '%b' "$TRIM_EXPECTED_ROW")" build/run.txt; then
            echo "::error::the trimmed read-only binary exited 0 without printing the expected row"
            exit 1
          fi
          while IFS= read -r line; do
            if ! grep -qxF "$(printf '%b' "$line")" build/run.txt; then
              echo "::error::the trimmed read-only binary exited 0 without printing: $line"
              exit 1
            fi
          done <<< "$TRIM_READ_LINES"
          # The untyped read (#1599 layer 6): its lines name each cell's type, checked against the JIT control's; the 4
          # reads each engine answers its own way (`engine_read`, #1599 layer 5); and the 3 located filter refusals
          # (`filter_refusal`, #1844): at least 4 + 4 + 3.
          test/trim/tools/same_lines.sh build/jit.txt build/run.txt 11
      - name: Run the pool's long-lived tasks in the trimmed binary
        # The reaper and the deferred close (#1599 layer 2): the `tasks` run adds two steps, about 20 s,
        # that fail with exit 4 or 5 when the task never ran. Runs even when the read above failed.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          julia --project=test/trim test/trim/prep.jl run-tasks
          set +e
          timeout -k 10 300 build/read run-tasks tasks 2>&1 | tee build/tasks.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "exit status: $status"
          if [ "$status" -ne 0 ]; then
            echo "::error::the trimmed binary's tasks run exited with status $status (4 = reaper, 5 = deferred close, 124 = timed out)"
            exit 1
          fi
          grep -q "$(printf 'step\treap\tclosed ')" build/tasks.txt &&
            grep -q "$(printf 'step\tclose\tdeferred')" build/tasks.txt || {
            echo "::error::the trimmed binary's tasks run exited 0 without the reap and close lines"
            exit 1
          }
      - name: Count the verifier's rows
        if: always()
        run: |
          [ -f build/build.log ] || exit 0
          python3 -I test/trim/tools/rows.py build/build.log > build/rows.txt 2>&1 || true
          python3 -I test/trim/tools/classify.py build/build.log --layers > build/layers.txt 2>&1 || true
          {
            echo "## Trimmed read-only entry (Julia $TRIM_JULIA, JuliaC $TRIM_JULIAC)"
            echo
            echo "The row count is reported, not checked. The pass condition is the run below."
            echo
            echo "### The binary's step lines"
            echo '```'
            cat build/run.txt 2>/dev/null || echo "(the binary did not run)"
            echo '```'
            echo "### The tasks run's step lines"
            echo '```'
            cat build/tasks.txt 2>/dev/null || echo "(the tasks run did not run)"
            echo '```'
            echo "### Verifier rows (rows.py)"
            echo '```'
            cat build/rows.txt
            echo '```'
            echo "### Rows by layer (classify.py --layers)"
            echo '```'
            cat build/layers.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the build log and the row tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trim-read-only
          path: |
            build/build.log
            build/rows.txt
            build/layers.txt
            build/run.txt
            build/tasks.txt
          if-no-files-found: warn

  # ── The full SQLite entry: the write (#1694) ─────────────────────────────────────────────────────
  # test/trim/main.jl: boot, two creates PormG refuses before any SQL, the read steps (TRIM_READ_LINES), a create that leaves three fields to
  # the write's own fill (a DateTimeField among them), the typed read of both rows, an update and a delete,
  # each checked by a typed read, then a bulk_insert of two rows that the typed read sees, and one whose second row
  # validation refuses (its refusal's text, and no row written). The job fails
  # unless the binary exits 0 and prints each of those lines.

  full-write:
    name: Trimmed write (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.TRIM_JULIA }}
      - uses: julia-actions/cache@v2
      - name: Install JuliaC
        run: |
          julia -e 'using Pkg; Pkg.Apps.add(name = "JuliaC", version = ENV["TRIM_JULIAC"])'
          echo "$(julia -e 'print(first(DEPOT_PATH))')/bin" >> "$GITHUB_PATH"
      - name: Instantiate the fixture
        run: |
          julia --project=test/trim -e 'using Pkg; Pkg.instantiate(); Pkg.status()'
      - name: JIT control
        run: |
          julia --project=test/trim test/trim/prep.jl run-jit
          mkdir -p build
          julia --project=test/trim test/trim/main.jl run-jit | tee build/jit.txt   # its untyped-read lines are the binary's reference
      - name: Build the trimmed binary
        id: build
        run: |
          mkdir -p build && cd build
          JULIA_CPU_TARGET=native juliac --project ../test/trim --output-exe main \
            --trim=unsafe-warn --experimental ../test/trim/main.jl 2>&1 | tee build.log
      - name: Run the trimmed binary
        run: |
          julia --project=test/trim test/trim/prep.jl run
          # A task body the image never compiled dies silently, so a broken binary hangs rather
          # than crashes: the timeout turns the hang into a failure.
          set +e
          timeout -k 10 300 build/main run 2>&1 | tee build/run.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "exit status: $status"
          if [ "$status" -ne 0 ]; then
            echo "::error::the trimmed write binary exited with status $status (1 boot, 2 write, 3 read, 6 a create was not refused with an InvalidValueError, 7 update, 8 delete, 9 bulk_insert, 10 comparison filter, 11 order_by, 12 a bulk_insert row was not refused with an InvalidValueError, 13 lookup, 14 expression comparison, 15 bulk_update, 16 update_or_create, 17 untyped read, 18 get_or_create, 19 function read, 20 subquery read, 21 join read, 22 cascading delete, 24 user transaction, 25 close_all, 26 CTE read, 27 bulk_update with filters= or two keys, 28 SET_DEFAULT, 29 self-referential cascade, 30 a bulk refusal, 31 bulk_insert on_conflict, 33 a second key, 34 the @import_models read, 35 nested transaction, 36 a read on a spawned task, 37 relation hops, 38 lookup or Q/Qor, 39 paging, 40 aggregate, 41 an engine's own read, 42 count, 43 exists, 44 a locking read in a transaction, 45 a raw fetch, 46 typed rows into a table sink, 47 bulk writes from a column table, 49 a delete rule, 50 the JSON and network lookups, 51 Q/Qor from 32 arguments, 54 a .copy() read, 56 a many-to-many hop, 57 a filter on an aggregate alias (HAVING), 52 a refused filter value not located as InvalidValueError, 53 the array lookups, 55 a write through a .copy(), 124 timed out)"
            exit 1
          fi
          # Each step's own line, exactly as its JIT control prints it (test/trim/steps.jl): the read steps, then the
          # write's.
          mapfile -t expected <<< "$TRIM_READ_LINES"
          expected+=(
            # How an application starts (#1599 layers 1-3): models loaded with @import_models in a package body and read
            # through the key they kept, registered in code; and a second key with writes off (test/trim/README.md).
            'step\timported\t@import_models 1 rows: 2008 Monaco Grand Prix; invokelatest 1 rows'
            'step\tkeys\t1 rows on f1, 1 on f1_ro; a create on f1_ro refused with WritesDisabledError'
            # A locking read in a transaction and a raw fetch, after the read steps (#1599 layer 6, test/trim/tools/terminals.jl).
            'step\tlock\tselect_for_update(of = self) 2 rows: Monaco Grand Prix, Brazilian Grand Prix'
            'step\traw_fetch\tupdate +100: rounds 18, 106; in a transaction -100: rounds 6, 18'
            'step\twrite\tok'
            'step\tquery\t2 rows'
            'step\trow\t1 2008 Monaco Grand Prix 2008-05-25'
            'step\trow\t3 2009 Monaco Grand Prix 2009-05-24'
            'step\tupdate\t1 rows; round 7'
            'step\tdelete\t1 rows; 1 left'
            'step\tbulk\t2 rows; 2 read back'
            # A bulk_insert with one invalid row: the refusal by its row and field, as the JIT prints it, not the
            # MethodError the row loop's error pass raised in a trimmed binary (#1694), and no row written.
            'step\tbulk_refused\tInvalidValueError: Error in bulk_insert, row 2 for model race, field `date`: The date is invalid: it is not a calendar date in the format YYYY-MM-DD (from column date).'
            'step\tbulk_refused\t0 rows written; 1 Monaco races'
            # The upsert-shaped writes (#1694): bulk_update of the two bulk-inserted races, then update_or_create's insert
            # and update of one explicit id, each read back typed and undone (test/trim/tools/writes.jl).
            'step\tbulk_update\t2 rows; rounds 7, 8'
            'step\tupdate_or_create\tfirst created true; second created false; round 7'
            # A handler create wrote through, copied, and a create through the copy (#1684), both read back and undone.
            'step\tcopy_write\t2 rows: 2012, 2013'
            # The cascading delete (#1694, #1599 layer 7): a race's pit stops deleted with it (CASCADE), its debuting
            # driver kept with no debut race (SET_NULL), and the rows prep.jl seeded left as they were.
            'step\tcascade\t3 rows; pitstop 2, race 1'
            'step\tcascade\t0 pit stops left; 1 driver, debut none'
            'step\tcascade\tseeded 1 pit stop, 1 driver; kept'
            # The write residue (#1694, #1599 layer 7): bulk_update with filters= and with two keys, SET_DEFAULT and a
            # self-referential CASCADE, each undone (test/trim/tools/writes.jl); the refusals are against the JIT control.
            'step\tbulk_update_more\tfilters: 1 rows; rounds 7, 6'
            'step\tbulk_update_more\ttwo keys: 2 rows; Monaco 2010, Monaco 2011'
            'step\tset_default\t1 rows; circuit 1; home default'
            'step\tself_cascade\t4 rows; constructor 4; 0 left; seeded chain kept'
            'step\tbulk_refusal\t0 races written'
            # bulk_insert's on_conflict= (#1694, #1599 layer 7): an upsert over an existing race and a new one, then a skip
            # over one and a new one, each read back typed and undone (test/trim/tools/writes.jl).
            'step\tbulk_conflict\tupdate 2 rows; rounds 7, 6'
            'step\tbulk_conflict\tnothing 1 rows; rounds 7, 6, 6'
            # Bulk writes from a column table, and the delete rules beyond CASCADE (#1694, #1599 layer 7, test/trim/tools/writes.jl).
            'step\tbulk_table\tcolumns= pairs: 2 rows: 2040 round 6, 2041 round 7; two filters= pairs: 2 rows: 2040 round 16, 2041 round 17; removed 2'
            'step\tdelete_rules\tPROTECT: refused with ProtectedError (result.raceid); RESTRICT: refused with ProtectedError (result.driverid); kept 1 race, 1 driver, 1 result'
            'step\tdelete_rules\tSET_NULL: deleted 1, 2031 previous none'
            # A user transaction that commits and one that rolls back on the block's own error (#1599 layer 2), then
            # close_all!() last, since a trimmed binary runs no atexit hook (test/trim/tools/connections.jl).
            'step\ttransaction\tcommitted 1 seen inside, 1 after; rolled back on TrimRollback, 0 left; removed 1'
            # A transaction inside one (a savepoint) and a read on spawned tasks (#1599 layer 2).
            'step\tnested_transaction\tcommitted 2 seen inside, 2 after; inner rolled back on TrimRollback, kept 2020; removed 3'
            'step\tspawned\t@spawn 2 rows: Monaco Grand Prix, Brazilian Grand Prix; @async 2 rows: Monaco Grand Prix, Brazilian Grand Prix'
            'step\tclose_all\t1 open before, 0 after; the handle closed'
          )
          missing=0
          for line in "${expected[@]}"; do
            if ! grep -qxF "$(printf '%b' "$line")" build/run.txt; then
              echo "::error::the trimmed write binary exited 0 without printing: $line"
              missing=1
            fi
          done
          # The untyped read and get_or_create (#1599 layer 6), the 26 bulk refusals (#1694), the 4 engine_read lines
          # (#1599 layer 5), and the 4 array lookups and 3 located filter refusals (#1844), against the JIT control's lines:
          # at least 5 + 26 + 4 + 4 + 3.
          test/trim/tools/same_lines.sh build/jit.txt build/run.txt 42 || missing=1
          refused=$(grep -c "$(printf '^step\trefused\tInvalidValueError: ')" build/run.txt || true)
          if [ "$refused" -ne 2 ]; then
            echo "::error::the trimmed write binary printed $refused refusal lines, expected 2"
            missing=1
          fi
          exit $missing
      - name: Count the verifier's rows
        if: always()
        run: |
          [ -f build/build.log ] || exit 0
          python3 -I test/trim/tools/rows.py build/build.log > build/rows.txt 2>&1 || true
          python3 -I test/trim/tools/classify.py build/build.log --layers > build/layers.txt 2>&1 || true
          {
            echo "## Trimmed full entry, the write (Julia $TRIM_JULIA, JuliaC $TRIM_JULIAC)"
            echo
            echo "The row count is reported, not checked. The pass condition is the run below."
            echo
            echo "### The binary's step lines"
            echo '```'
            cat build/run.txt 2>/dev/null || echo "(the binary did not run)"
            echo '```'
            echo "### Verifier rows (rows.py)"
            echo '```'
            cat build/rows.txt
            echo '```'
            echo "### Rows by layer (classify.py --layers)"
            echo '```'
            cat build/layers.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the build log and the row tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trim-full
          path: |
            build/build.log
            build/rows.txt
            build/layers.txt
            build/run.txt
          if-no-files-found: warn

  # ── The server variants (#1614) ──────────────────────────────────────────────────────────────────
  # The two jobs below run the same steps; only their service, variant and SQLSTATE differ. The database
  # credentials are throwaway values for the service container this job starts and discards, and belong to
  # no other server. The fixture's prep.jl refuses a database whose name lacks "trim", hence pormg_trim.

  mysql-read:
    name: Trimmed read (MySQL 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: trim-ci-root-throwaway
          MYSQL_DATABASE: pormg_trim
          MYSQL_USER: f1
          MYSQL_PASSWORD: trim-ci-throwaway
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptrim-ci-root-throwaway"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      TRIM_VARIANT: mysql
      # The server's own error for the `fail` step's missing table (ER_NO_SUCH_TABLE).
      TRIM_FAIL_SQLSTATE: 42S02
      PORMG_TRIM_HOST: 127.0.0.1
      PORMG_TRIM_PORT: '3306'
      PORMG_TRIM_USER: f1
      PORMG_TRIM_PASSWORD: trim-ci-throwaway
      PORMG_TRIM_DATABASE: pormg_trim
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.TRIM_JULIA }}
      - uses: julia-actions/cache@v2
      - name: Install JuliaC
        run: |
          julia -e 'using Pkg; Pkg.Apps.add(name = "JuliaC", version = ENV["TRIM_JULIAC"])'
          echo "$(julia -e 'print(first(DEPOT_PATH))')/bin" >> "$GITHUB_PATH"
      - name: Instantiate the fixture
        run: julia --project=test/trim/$TRIM_VARIANT -e 'using Pkg; Pkg.instantiate(); Pkg.status()'
      - name: Seed the database and run the JIT control
        run: |
          julia --project=test/trim/$TRIM_VARIANT test/trim/$TRIM_VARIANT/prep.jl
          mkdir -p build
          julia --project=test/trim/$TRIM_VARIANT test/trim/$TRIM_VARIANT/main.jl | tee build/jit.txt   # the untyped-read reference
      - name: Build the trimmed binary
        id: build
        run: |
          mkdir -p build && cd build
          JULIA_CPU_TARGET=native juliac --project ../test/trim/$TRIM_VARIANT --output-exe main \
            --trim=unsafe-warn --experimental ../test/trim/$TRIM_VARIANT/main.jl 2>&1 | tee build.log
      - name: Clear the server's authentication cache
        # prep.jl and the JIT control logged in as f1, so caching_sha2_password would let the binary in by
        # its fast path. Flushed, the binary takes the full authentication a fresh server asks for.
        run: mysql -h 127.0.0.1 -uroot -ptrim-ci-root-throwaway -e 'FLUSH PRIVILEGES'
      - name: Run the trimmed binary against the server
        run: |
          # A task body the image never compiled dies silently, so a broken binary hangs rather than
          # crashes: the timeout turns the hang into a failure.
          set +e
          timeout -k 10 300 build/main 2>&1 | tee build/run.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "exit status: $status"
          if [ "$status" -ne 0 ]; then
            echo "::error::the trimmed $TRIM_VARIANT binary exited with status $status (1 boot, 2 write, 3 read, 6 the fail step did not raise the server's error, 7 update, 8 delete, 9 bulk_insert, 10 comparison filter, 11 order_by, 13 lookup, 14 expression comparison, 15 bulk_update, 16 update_or_create, 17 untyped read, 18 get_or_create, 19 function read, 20 subquery read, 21 join read, 22 cascading delete, 24 user transaction, 25 close_all, 26 CTE read, 27 bulk_update with filters= or two keys, 28 SET_DEFAULT, 29 self-referential cascade, 30 a bulk refusal, 31 bulk_insert on_conflict, 32 the allocated-key refusal, 33 a second key, 35 nested transaction, 36 a read on a spawned task, 37 relation hops, 38 lookup or Q/Qor, 39 paging, 40 aggregate, 41 an engine's own read, 42 count, 43 exists, 44 a locking read in a transaction, 45 a raw fetch, 46 typed rows into a table sink, 47 bulk writes from a column table, 49 a delete rule, 50 the JSON and network lookups, 51 Q/Qor from 32 arguments, 54 a .copy() read, 56 a many-to-many hop, 57 a filter on an aggregate alias (HAVING), 52 a refused filter value not located as InvalidValueError, 53 the array lookups, 55 a write through a .copy(), 124 timed out)"
            exit 1
          fi
          if ! grep -qxF "$(printf '%b' "$TRIM_EXPECTED_ROW")" build/run.txt; then
            echo "::error::the trimmed $TRIM_VARIANT binary exited 0 without printing the expected row"
            exit 1
          fi
          # The read steps (test/trim/tools/reads.jl, #1599 layer 5), before the write.
          while IFS= read -r line; do
            if ! grep -qxF "$(printf '%b' "$line")" build/run.txt; then
              echo "::error::the trimmed $TRIM_VARIANT binary exited 0 without printing: $line"
              exit 1
            fi
          done <<< "$TRIM_READ_LINES"
          # The untyped read and get_or_create (#1599 layer 6), the 26 bulk refusals (#1694), the 4 engine_read lines
          # (#1599 layer 5), and the 4 array lookups and 3 located filter refusals (#1844), against the JIT control's lines:
          # at least 5 + 26 + 4 + 4 + 3.
          test/trim/tools/same_lines.sh build/jit.txt build/run.txt 42
          # The single-row write (#1614, test/trim/tools/writes.jl): create with its auto-filled fields, the read
          # back (2 rows), update and delete, then a bulk_insert of two rows read back (#1694), and last the cascading
          # delete (#1694, #1599 layer 7; its rows are locked first, #1815). The written row's id is not checked: the
          # JIT control used one.
          for line in 'step\twrite\tok' 'step\tquery\t2 rows' 'step\tupdate\t1 rows; round 7' 'step\tdelete\t1 rows; 1 left' 'step\tbulk\t2 rows; 2 read back' 'step\tbulk_update\t2 rows; rounds 7, 8' 'step\tupdate_or_create\tfirst created true; second created false; round 7' 'step\tcopy_write\t2 rows: 2012, 2013' 'step\tcascade\t3 rows; pitstop 2, race 1' 'step\tcascade\t0 pit stops left; 1 driver, debut none' 'step\tcascade\tseeded 1 pit stop, 1 driver; kept' 'step\tbulk_update_more\tfilters: 1 rows; rounds 7, 6' 'step\tbulk_update_more\ttwo keys: 2 rows; Monaco 2010, Monaco 2011' 'step\tset_default\t1 rows; circuit 1; home default' 'step\tself_cascade\t4 rows; constructor 4; 0 left; seeded chain kept' 'step\tbulk_refusal\t0 races written' 'step\tbulk_conflict\tupdate 2 rows; rounds 7, 6' 'step\tbulk_conflict\tnothing 1 rows; rounds 7, 6, 6' 'step\tbulk_table\tcolumns= pairs: 2 rows: 2040 round 6, 2041 round 7; two filters= pairs: 2 rows: 2040 round 16, 2041 round 17; removed 2' 'step\tdelete_rules\tPROTECT: refused with ProtectedError (result.raceid); RESTRICT: refused with ProtectedError (result.driverid); kept 1 race, 1 driver, 1 result' 'step\tdelete_rules\tSET_NULL: deleted 1, 2031 previous none' 'step\ttransaction\tcommitted 1 seen inside, 1 after; rolled back on TrimRollback, 0 left; removed 1' 'step\tlock\tselect_for_update(of = self) 2 rows: Monaco Grand Prix, Brazilian Grand Prix' 'step\traw_fetch\tupdate +100: rounds 18, 106; in a transaction -100: rounds 6, 18' 'step\tkeys\t1 rows on f1, 1 on f1_ro; a create on f1_ro refused with WritesDisabledError' 'step\tnested_transaction\tcommitted 2 seen inside, 2 after; inner rolled back on TrimRollback, kept 2020; removed 3' 'step\tspawned\t@spawn 2 rows: Monaco Grand Prix, Brazilian Grand Prix; @async 2 rows: Monaco Grand Prix, Brazilian Grand Prix' 'step\tengine_read\tExtract EPOCH: Monaco Grand Prix 1211673600, Brazilian Grand Prix 1225584000' 'step\tclose_all\t1 open before, 0 after; the handle closed'; do
            if ! grep -qxF "$(printf '%b' "$line")" build/run.txt; then
              echo "::error::the trimmed $TRIM_VARIANT binary exited 0 without printing: $line"
              exit 1
            fi
          done
          # The `fail` step (test/trim/tools/failing.jl): the server's own error, its SQLSTATE and its
          # message, with a cause that is the driver's error and not a MethodError from the error path.
          if ! grep -qxF "$(printf 'step\tfail\tthrew StatementError')" build/run.txt ||
             ! grep -qxF "  sqlstate: $TRIM_FAIL_SQLSTATE" build/run.txt ||
             ! grep -q '^  message: .*pormg_trim_missing' build/run.txt ||
             grep -qE '^  cause: MethodError$|^  cause missed:' build/run.txt; then
            echo "::error::the trimmed $TRIM_VARIANT binary's fail step did not print the server's error (SQLSTATE $TRIM_FAIL_SQLSTATE)"
            exit 1
          fi
      - name: Count the verifier's rows
        if: always()
        run: |
          [ -f build/build.log ] || exit 0
          python3 -I test/trim/tools/rows.py build/build.log > build/rows.txt 2>&1 || true
          python3 -I test/trim/tools/classify.py build/build.log --layers > build/layers.txt 2>&1 || true
          {
            echo "## Trimmed $TRIM_VARIANT read (Julia $TRIM_JULIA, JuliaC $TRIM_JULIAC)"
            echo
            echo "The row count is reported, not checked. The pass condition is the run below."
            echo
            echo "### The binary's step lines"
            echo '```'
            cat build/run.txt 2>/dev/null || echo "(the binary did not run)"
            echo '```'
            echo "### Verifier rows (rows.py)"
            echo '```'
            cat build/rows.txt
            echo '```'
            echo "### Rows by layer (classify.py --layers)"
            echo '```'
            cat build/layers.txt
            echo '```'
