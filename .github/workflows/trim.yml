        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trim-${{ env.TRIM_VARIANT }}
          path: |
            build/build.log
            build/rows.txt
            build/layers.txt
            build/run.txt
          if-no-files-found: warn

