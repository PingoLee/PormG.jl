name: Documentation

on:
  push:
    branches:
      - main # ou master
    tags: '*'
  pull_request:

jobs:
  build:
    permissions:
      contents: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Configure doc environment
        working-directory: ${{ github.workspace }}
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Token automático do GitHub
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # Só necessário se o GITHUB_TOKEN falhar (raro em repos públicos)
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate(); include("docs/make.jl")'