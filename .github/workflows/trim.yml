        # authentication the Base64 roots exist for (`trim_entrypoints`, through the Postgres.jl extension).
        image: postgres:19
        env:
          POSTGRES_DB: pormg_trim
          POSTGRES_USER: f1
          POSTGRES_PASSWORD: trim-ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U f1 -d pormg_trim"
          --health-interval 5s --health-timeout 5s --health-retries 30
